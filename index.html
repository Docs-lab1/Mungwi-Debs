        // ================================================================
        //  LOAD DATA
        // ================================================================
        async function loadData() {
            showToast('📊 Loading data...', 'info');

            try {
                // Try localStorage first (fastest)
                let schoolsData = JSON.parse(localStorage.getItem('schools') || 'null');
                let recordsData = JSON.parse(localStorage.getItem('records') || 'null');

                if (schoolsData && recordsData && schoolsData.length > 0) {
                    schools = schoolsData;
                    records = recordsData;
                    filteredRecords = records;
                    renderAll();
                    showToast('📊 Loaded ' + records.length + ' records from local storage', 'success');
                    dataLoaded = true;
                }

                // Then try Supabase
                if (supabase) {
                    try {
                        const { data: sData, error: sErr } = await supabase.from('schools').select('*').order('name');
                        if (!sErr && sData && sData.length > 0) {
                            schools = sData;
                            localStorage.setItem('schools', JSON.stringify(schools));
                        }

                        const { data: rData, error: rErr } = await supabase.from('records').select('*').order(
                            'created_at', { ascending: false });
                        if (!rErr && rData && rData.length > 0) {
                            records = rData;
                            localStorage.setItem('records', JSON.stringify(records));
                            filteredRecords = records;
                            renderAll();
                            showToast('✅ Loaded ' + records.length + ' records from Supabase', 'success');
                            dataLoaded = true;
                        }
                    } catch (e) {
                        console.warn('Supabase load error:', e);
                    }
                }

                // If still no data, seed sample
                if (!dataLoaded || (schools.length === 0 && records.length === 0)) {
                    schools = getSampleSchools();
                    records = getSampleRecords();
                    localStorage.setItem('schools', JSON.stringify(schools));
                    localStorage.setItem('records', JSON.stringify(records));
                    filteredRecords = records;
                    renderAll();
                    showToast('📦 Sample data loaded', 'info');
                    dataLoaded = true;
                }

                // Try to sync to Supabase
                if (isSupabaseConnected && supabase && dataLoaded) {
                    try {
                        for (const s of schools) {
                            await supabase.from('schools').upsert(s, { onConflict: 'id' });
                        }
                        for (const r of records) {
                            await supabase.from('records').upsert(r, { onConflict: 'id' });
                        }
                    } catch (e) {
                        console.warn('Supabase sync error:', e);
                    }
                }

            } catch (err) {
                console.error('Load error:', err);
                schools = getSampleSchools();
                records = getSampleRecords();
                filteredRecords = records;
                renderAll();
                showToast('⚠️ Using sample data', 'warning');
                dataLoaded = true;
            }

            updateBadges();
        }

            const data = filteredRecords;

            if (data.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="12" class="empty-state"><i class="fas fa-inbox"></i><p>No records found.</p></td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(r => {
                const total = (r.enrolment_boys || 0) + (r.enrolment_girls || 0);
                const dropouts = (r.dropout_preg_boys || 0) + (r.dropout_preg_girls || 0) +
                    (r.dropout_marriage_boys || 0) + (r.dropout_marriage_girls || 0) +
                    (r.dropout_death_boys || 0) + (r.dropout_death_girls || 0) +
                    (r.dropout_illness_boys || 0) + (r.dropout_illness_girls || 0) +
                    (r.dropout_orphaned_boys || 0) + (r.dropout_orphaned_girls || 0) +
                    (r.dropout_economic_boys || 0) + (r.dropout_economic_girls || 0) +
                    (r.dropout_ovc_boys || 0) + (r.dropout_ovc_girls || 0);
                const absent = (r.absenteeism_boys || 0) + (r.absenteeism_girls || 0);
                const reentry = (r.reentry_boys || 0) + (r.reentry_girls || 0);
                const ovc = (r.ovc_boys || 0) + (r.ovc_girls || 0);
                const schoolName = schoolMap[r.school_id] || r.school_id;
                return `<tr>
                            <td style="text-align:left;padding-left:12px;font-weight:600;">${schoolName}</td>
                            <td>${r.grade || '-'}</td>
                            <td>${r.enrolment_boys || 0}</td>
                            <td>${r.enrolment_girls || 0}</td>
                            <td><strong>${total}</strong></td>
                            <td>${r.age_range || '-'}</td>
                            <td>${r.teen_preg || 0}</td>
                            <td>${dropouts}</td>
                            <td>${absent}</td>
                            <td>${reentry}</td>
                            <td>${ovc}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteRecord('${r.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>`;
            }).join('');

            $('recordCount').textContent = data.length + ' records';
            $('exportCount').textContent = data.length;
        }

        // ================================================================
        //  UPDATE STATS
        // ================================================================
        function updateStats() {
            const schoolSet = new Set(records.map(r => r.school_id));
            let totalEnrol = 0,
                teenPreg = 0,
                dropouts = 0,
                absent = 0,
                ovc = 0;
            records.forEach(r => {
                totalEnrol += (r.enrolment_boys || 0) + (r.enrolment_girls || 0);
                teenPreg += (r.teen_preg || 0);
                dropouts += (r.dropout_preg_boys || 0) + (r.dropout_preg_girls || 0) +
                    (r.dropout_marriage_boys || 0) + (r.dropout_marriage_girls || 0) +
                    (r.dropout_death_boys || 0) + (r.dropout_death_girls || 0) +
                    (r.dropout_illness_boys || 0) + (r.dropout_illness_girls || 0) +
                    (r.dropout_orphaned_boys || 0) + (r.dropout_orphaned_girls || 0) +
                    (r.dropout_economic_boys || 0) + (r.dropout_economic_girls || 0) +
                    (r.dropout_ovc_boys || 0) + (r.dropout_ovc_girls || 0);
                absent += (r.absenteeism_boys || 0) + (r.absenteeism_girls || 0);
                ovc += (r.ovc_boys || 0) + (r.ovc_girls || 0);
            });
            $('statSchools').textContent = schoolSet.size || 0;
            $('statEnrolment').textContent = totalEnrol;
            $('statTeenPreg').textContent = teenPreg;
            $('statDropouts').textContent = dropouts;
            $('statAbsenteeism').textContent = absent;
            $('statOvc').textContent = ovc;
        }

        // ================================================================
        //  POPULATE FILTER
        // ================================================================
        function populateFilter() {
            const sel = $('filterSchool');
            if (!sel) return;
            const currentVal = sel.value;
            sel.innerHTML = `<option value="">All Schools</option>` +
                schools.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            sel.value = currentVal;
            applyFilter();
        }

        function applyFilter() {
            const sel = $('filterSchool');
            const val = sel ? sel.value : '';
            if (val) {
                filteredRecords = records.filter(r => r.school_id === val);
            } else {
                filteredRecords = records;
            }
            renderRecords();
        }

        // ================================================================
        //  UPDATE BADGES
        // ================================================================
        function updateBadges() {
            $('schoolBadge').textContent = schools.length;
            $('recordBadge').textContent = records.length;
        }

        // ================================================================
        //  TOGGLE ADD SCHOOL
        // ================================================================
        function toggleAddSchool() {
            const form = $('addSchoolForm');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                $('newSchoolName').focus();
            }
        }

        // ================================================================
        //  ADD SCHOOL
        // ================================================================
        async function addSchool() {
            const input = $('newSchoolName');
            const name = input.value.trim();
            if (!name) {
                showToast('Please enter a school name.', 'error');
                return;
            }

            const newSchool = { id: 's' + Date.now(), name: name };

            try {
                if (isSupabaseConnected && supabase) {
                    const { error } = await supabase.from('schools').insert([newSchool]);
                    if (error) throw new Error(error.message);
                }
                schools.push(newSchool);
                localStorage.setItem('schools', JSON.stringify(schools));

                input.value = '';
                toggleAddSchool();
                renderAll();
                showToast('✅ School added!', 'success');
            } catch (err) {
                showToast('❌ Failed to add: ' + err.message, 'error');
            }
        }

        // ================================================================
        //  DELETE SCHOOL
        // ================================================================
        async function deleteSchool(id) {
            if (!confirm('Delete this school? All associated data will be removed.')) return;
            try {
                if (isSupabaseConnected && supabase) {
                    const { error } = await supabase.from('schools').delete().eq('id', id);
                    if (error) throw new Error(error.message);
                }
                schools = schools.filter(s => s.id !== id);
                records = records.filter(r => r.school_id !== id);
                localStorage.setItem('schools', JSON.stringify(schools));
                localStorage.setItem('records', JSON.stringify(records));
                renderAll();
                showToast('✅ School deleted!', 'success');
            } catch (err) {
                showToast('❌ Failed to delete: ' + err.message, 'error');
            }
        }

        // ================================================================
        //  DELETE RECORD
        // ================================================================
        async function deleteRecord(id) {
            if (!confirm('Delete this record?')) return;
            try {
                if (isSupabaseConnected && supabase) {
                    const { error } = await supabase.from('records').delete().eq('id', id);
                    if (error) throw new Error(error.message);
                }
                records = records.filter(r => r.id !== id);
                localStorage.setItem('records', JSON.stringify(records));
                renderAll();
                showToast('✅ Record deleted!', 'success');
            } catch (err) {
                showToast('❌ Failed to delete: ' + err.message, 'error');
            }
        }

        // ================================================================
        //  SYNC TO SUPABASE
        // ================================================================
        async function syncToSupabase() {
            if (!isSupabaseConnected || !supabase) {
                showToast('⚠️ Not connected to Supabase.', 'error');
                return;
            }

            showToast('🔄 Syncing to Supabase...', 'info');

            try {
                for (const s of schools) {
                    await supabase.from('schools').upsert(s, { onConflict: 'id' });
                }
                for (const r of records) {
                    await supabase.from('records').upsert(r, { onConflict: 'id' });
                }
                showToast('✅ All data synced to Supabase!', 'success');
            } catch (err) {
                showToast('❌ Sync failed: ' + err.message, 'error');
                console.error('Sync error:', err);
            }
        }

        // ================================================================
        //  EXPORT TO EXCEL
        // ================================================================
        function exportToExcel() {
            if (records.length === 0) {
                showToast('No data to export.', 'error');
                return;
            }

            const schoolMap = {};
            schools.forEach(s => schoolMap[s.id] = s.name);

            const rows = records.map((r, i) => {
                const total = (r.enrolment_boys || 0) + (r.enrolment_girls || 0);
                const earlyTotal = (r.early_marriage_boys || 0) + (r.early_marriage_girls || 0);
                const absentTotal = (r.absenteeism_boys || 0) + (r.absenteeism_girls || 0);
                const reentryTotal = (r.reentry_boys || 0) + (r.reentry_girls || 0);
                const ovcTotal = (r.ovc_boys || 0) + (r.ovc_girls || 0);
                return {
                    'S/N': i + 1,
                    'School': schoolMap[r.school_id] || r.school_id,
                    'Grade': r.grade || '',
                    'Enrolment Boys': r.enrolment_boys || 0,
                    'Enrolment Girls': r.enrolment_girls || 0,
                    'Enrolment Total': total,
                    'Age Range': r.age_range || '',
                    'Teen Pregnancy': r.teen_preg || 0,
                    'Early Marriage Boys': r.early_marriage_boys || 0,
                    'Early Marriage Girls': r.early_marriage_girls || 0,
                    'Early Marriage Total': earlyTotal,
                    'Drop-Preg Boys': r.dropout_preg_boys || 0,
                    'Drop-Preg Girls': r.dropout_preg_girls || 0,
                    'Drop-Marriage Boys': r.dropout_marriage_boys || 0,
                    'Drop-Marriage Girls': r.dropout_marriage_girls || 0,
                    'Drop-Death Boys': r.dropout_death_boys || 0,
                    'Drop-Death Girls': r.dropout_death_girls || 0,
                    'Drop-Illness Boys': r.dropout_illness_boys || 0,
                    'Drop-Illness Girls': r.dropout_illness_girls || 0,
                    'Drop-Orphaned Boys': r.dropout_orphaned_boys || 0,
                    'Drop-Orphaned Girls': r.dropout_orphaned_girls || 0,
                    'Drop-Economic Boys': r.dropout_economic_boys || 0,
                    'Drop-Economic Girls': r.dropout_economic_girls || 0,
                    'Drop-OVC Boys': r.dropout_ovc_boys || 0,
                    'Drop-OVC Girls': r.dropout_ovc_girls || 0,
                    'Absenteeism Boys': r.absenteeism_boys || 0,
                    'Absenteeism Girls': r.absenteeism_girls || 0,
                    'Absenteeism Total': absentTotal,
                    'Re-entry Boys': r.reentry_boys || 0,
                    'Re-entry Girls': r.reentry_girls || 0,
                    'Re-entry Total': reentryTotal,
                    'Re-admission Boys': r.readmission_boys || 0,
                    'Re-admission Girls': r.readmission_girls || 0,
                    'OVC Boys': r.ovc_boys || 0,
                    'OVC Girls': r.ovc_girls || 0,
                    'OVC Total': ovcTotal
                };
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, 'Termly Report 2026');
            XLSX.writeFile(wb, `Mungwi_Termly_Report_2026_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast('✅ Excel exported successfully!', 'success');
        }

        // ================================================================
        //  EXPORT TO CSV
        // ================================================================
        function exportToCSV() {
            if (records.length === 0) {
                showToast('No data to export.', 'error');
                return;
            }

            const schoolMap = {};
            schools.forEach(s => schoolMap[s.id] = s.name);

            let csv = 'S/N,School,Grade,Enrolment Boys,Enrolment Girls,Enrolment Total,Age Range,Teen Pregnancy,' +
                'Early Marriage Boys,Early Marriage Girls,Early Marriage Total,' +
                'Drop-Preg Boys,Drop-Preg Girls,Drop-Marriage Boys,Drop-Marriage Girls,' +
                'Drop-Death Boys,Drop-Death Girls,Drop-Illness Boys,Drop-Illness Girls,' +
                'Drop-Orphaned Boys,Drop-Orphaned Girls,Drop-Economic Boys,Drop-Economic Girls,' +
                'Drop-OVC Boys,Drop-OVC Girls,Absenteeism Boys,Absenteeism Girls,Absenteeism Total,' +
                'Re-entry Boys,Re-entry Girls,Re-entry Total,Re-admission Boys,Re-admission Girls,' +
                'OVC Boys,OVC Girls,OVC Total\n';

            records.forEach((r, i) => {
                const total = (r.enrolment_boys || 0) + (r.enrolment_girls || 0);
                const earlyTotal = (r.early_marriage_boys || 0) + (r.early_marriage_girls || 0);
                const absentTotal = (r.absenteeism_boys || 0) + (r.absenteeism_girls || 0);
                const reentryTotal = (r.reentry_boys || 0) + (r.reentry_girls || 0);
                const ovcTotal = (r.ovc_boys || 0) + (r.ovc_girls || 0);

                csv +=
                    `${i+1},"${schoolMap[r.school_id] || r.school_id}","${r.grade||''}",${r.enrolment_boys||0},${r.enrolment_girls||0},${total},"${r.age_range||''}",${r.teen_preg||0},${r.early_marriage_boys||0},${r.early_marriage_girls||0},${earlyTotal},${r.dropout_preg_boys||0},${r.dropout_preg_girls||0},${r.dropout_marriage_boys||0},${r.dropout_marriage_girls||0},${r.dropout_death_boys||0},${r.dropout_death_girls||0},${r.dropout_illness_boys||0},${r.dropout_illness_girls||0},${r.dropout_orphaned_boys||0},${r.dropout_orphaned_girls||0},${r.dropout_economic_boys||0},${r.dropout_economic_girls||0},${r.dropout_ovc_boys||0},${r.dropout_ovc_girls||0},${r.absenteeism_boys||0},${r.absenteeism_girls||0},${absentTotal},${r.reentry_boys||0},${r.reentry_girls||0},${reentryTotal},${r.readmission_boys||0},${r.readmission_girls||0},${r.ovc_boys||0},${r.ovc_girls||0},${ovcTotal}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Mungwi_Termly_Report_2026_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ CSV exported successfully!', 'success');
        }

        // ================================================================
        //  WORKSHEET TABS
        // ================================================================
        document.querySelectorAll('.sheet-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.worksheet').forEach(w => w.classList.remove('active'));
                const target = $('sheet-' + this.dataset.sheet);
                if (target) target.classList.add('active');
            });
        });

        // ================================================================
        //  INIT SUPABASE
        // ================================================================
        async function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase client created');

                const { error } = await supabase.from('schools').select('count', { count: 'exact', head: true });

                if (error && error.message && error.message.includes('relation "schools" does not exist')) {
                    isSupabaseConnected = false;
                    updateStatusDot(false);
                    showToast('⚠️ Tables not found. Using local storage.', 'warning');
                    return false;
                }

                isSupabaseConnected = true;
                updateStatusDot(true);
                showToast('✅ Connected to Supabase', 'success');
                return true;

            } catch (e) {
                isSupabaseConnected = false;
                updateStatusDot(false);
                showToast('⚠️ Using local storage only', 'info');
                return false;
            }
        }

        // ================================================================
        //  BOOT
        // ================================================================
        async function init() {
            await initSupabase();
            await loadData();
            console.log('📊 Mungwi Termly Reporting Tool 2026 loaded.');
            console.log('📡 Connection:', isSupabaseConnected ? 'Online' : 'Offline');
            console.log('📚 Records:', records.length);
            console.log('🏫 Schools:', schools.length);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
